<tr class="item-row">
    <td>{{ form.item }}{{ form.DELETE }}</td>
    <td class="item-code text-muted small text-nowrap">—</td>
    <td>{{ form.description }}</td>
    <td style="width:90px;">{{ form.quantity }}</td>
    <td style="width:110px;">{{ form.unit_price }}</td>
    <td style="width:90px;">{{ form.vat_percentage }}</td>
    <td class="text-end"><button type="button" class="btn btn-sm btn-outline-danger remove-row"><i class="bi bi-trash"></i></button></td>
</tr>
