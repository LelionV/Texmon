{% extends "base.html" %}
{% block page_title %}Generate Statement of Account{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {% if form.non_field_errors %}<div class="alert alert-danger py-2">{{ form.non_field_errors }}</div>{% endif %}
            <div class="mb-2"><label class="form-label">Client</label>{{ form.client }}</div>
            <div class="row">
                <div class="col-6 mb-2"><label class="form-label">Date From</label>{{ form.date_from }}</div>
                <div class="col-6 mb-2"><label class="form-label">Date To</label>{{ form.date_to }}</div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-2">Generate</button>
        </form>
    </div>
</div>
{% endblock %}
